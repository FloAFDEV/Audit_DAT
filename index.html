<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audit Adhésifs DAT</title>
    
    <style>
      /* For Webkit-based browsers (Chrome, Safari, Edge) */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background-color: #e5e7eb; /* tailwind gray-200 */
        border-radius: 4px;
        border: 2px solid transparent;
        background-clip: content-box;
      }

      ::-webkit-scrollbar-thumb:hover {
        background-color: #d1d5db; /* tailwind gray-300 */
      }
      
      /* For Firefox */
      html {
        scrollbar-width: thin;
        scrollbar-color: #e5e7eb transparent; /* thumb track */
      }

      /* Ensure native UI controls like date pickers use a dark theme when in dark mode. */
      .dark {
        color-scheme: dark;
      }
      
      /* Style the calendar picker icon for Webkit browsers */
      input[type="date"]::-webkit-calendar-picker-indicator {
        cursor: pointer;
        /* Apply a filter to color the icon in teal for light mode */
        /* This filter is generated to approximate teal-600 (#0d9488) from black */
        filter: invert(48%) sepia(21%) saturate(2222%) hue-rotate(128deg) brightness(96%) contrast(92%);
      }

      /* In dark mode, override the filter to make the icon white for better contrast */
      .dark input[type="date"]::-webkit-calendar-picker-indicator {
        filter: brightness(0) invert(1);
      }

      /* Custom Menu Animations */
      @keyframes menu-in {
        from {
          opacity: 0;
          transform: translateY(-6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .menu-in-animate {
        animation: menu-in 220ms ease-out forwards;
      }

      @keyframes menu-out {
        from {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
        to {
          opacity: 0;
          transform: scale(0.98) translateY(-6px);
        }
      }
      .menu-out-animate {
        animation: menu-out 220ms ease-in forwards;
      }
      
      @keyframes menu-item-in {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .menu-item-animate {
        animation: menu-item-in 200ms ease-out forwards;
        opacity: 0; /* Start hidden */
      }
      
      @keyframes separator-in {
        from {
          transform: scaleX(0);
        }
        to {
          transform: scaleX(1);
        }
      }
      .separator-animate {
        transform-origin: left;
        animation: separator-in 200ms ease-out 100ms forwards;
        transform: scaleX(0); /* Start hidden */
      }
      
      @keyframes title-in {
          from { opacity: 0; }
          to { opacity: 1; }
      }
      .title-animate {
          animation: title-in 150ms ease-out forwards;
          opacity: 0; /* Start hidden */
      }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Apply theme from localStorage BEFORE page loads to prevent flash
      if (localStorage.getItem('tisseo-audit-theme') === 'dark') {
        document.documentElement.classList.add('dark')
      } else {
        document.documentElement.classList.remove('dark')
      }
      
      // Configuration script now runs AFTER the main Tailwind script is loaded.
      tailwind.config = {
        darkMode: 'class', // Enable class-based dark mode
        theme: {
          extend: {},
        },
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.1.1",

    "react-dom/": "https://aistudiocdn.com/react-dom@^19.1.1/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.418.0",
    "zustand": "https://aistudiocdn.com/zustand@^5.0.8",
    "dexie": "https://aistudiocdn.com/dexie@^4.2.0",
    "uuid": "https://aistudiocdn.com/uuid@^13.0.0",
    "react-hot-toast": "https://aistudiocdn.com/react-hot-toast@^2.4.1"
  }
}
</script>
</head>
