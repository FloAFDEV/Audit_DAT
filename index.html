    <style>
      /* For Webkit-based browsers (Chrome, Safari, Edge) */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background-color: #e5e7eb; /* tailwind gray-200 */
        border-radius: 4px;
        border: 2px solid transparent;
        background-clip: content-box;
      }

      ::-webkit-scrollbar-thumb:hover {
        background-color: #d1d5db; /* tailwind gray-300 */
      }
      
      /* For Firefox */
      html {
        scrollbar-width: thin;
        scrollbar-color: #e5e7eb transparent; /* thumb track */
      }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Apply theme from localStorage BEFORE page loads to prevent flash
      if (localStorage.getItem('tisseo-audit-theme') === 'dark') {
        document.documentElement.classList.add('dark')
      } else {
        document.documentElement.classList.remove('dark')
      }
      
      // Configuration script now runs AFTER the main Tailwind script is loaded.
      tailwind.config = {
        darkMode: 'class', // Enable class-based dark mode
        theme: {
          extend: {},
        },
      }
    </script>
